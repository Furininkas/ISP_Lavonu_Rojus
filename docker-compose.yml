services:
  db:
    image: postgres:16
    container_name: lavonu_rojus_db
    environment:
      POSTGRES_DB: lavonu_rojus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  dbdata: